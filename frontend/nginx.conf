server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Re-resolve the backend through Docker's DNS instead of caching its IP at startup.
    # With a literal `proxy_pass http://backend:8000`, nginx resolves once; when the
    # backend container is recreated it gets a new IP and every API call fails with 502.
    # A variable in proxy_pass forces resolution via `resolver` (re-checked every 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Same-origin API: the browser never talks to the backend directly, so the
    # refresh-token cookie stays first-party and no CORS preflight is needed.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: forward each chunk immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Static files served by the backend (images in assistant messages).
    location /static/ {
        proxy_pass $backend_upstream;
        expires 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
